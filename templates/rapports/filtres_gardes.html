{% extends "base.html" %}
{% block title %}État des gardes — Rapports{% endblock %}
{% block content %}
<div class="page-header">
    <div class="page-header__titles">
        <h1 class="page-title">État détaillé des gardes</h1>
        <p class="page-subtitle">Filtrez puis exportez en PDF ou Excel.</p>
    </div>
    <div><a href="{% url 'rapports:index' %}" class="btn-secondary">Retour</a></div>
</div>

<form method="get" class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label>Date de début</label>
            <input type="date" name="date_debut" class="form-input"
                   value="{{ filtres.date_debut|date:'Y-m-d' }}">
        </div>
        <div class="form-group">
            <label>Date de fin</label>
            <input type="date" name="date_fin" class="form-input"
                   value="{{ filtres.date_fin|date:'Y-m-d' }}">
        </div>
        <div class="form-group">
            <label>Agent</label>
            <select name="agent" class="form-select">
                <option value="">Tous</option>
                {% for a in agents %}
                <option value="{{ a.pk }}" {% if filtres.agent.pk == a.pk %}selected{% endif %}>
                    {{ a.matricule }} — {{ a.nom }} {{ a.prenoms }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Mission</label>
            <select name="mission" class="form-select">
                <option value="">Toutes</option>
                {% for m in missions %}
                <option value="{{ m.pk }}" {% if filtres.mission.pk == m.pk %}selected{% endif %}>
                    {{ m.libelle }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Conformité</label>
            <select name="conforme" class="form-select">
                <option value="">Toutes</option>
                <option value="1" {% if filtres.conforme == True %}selected{% endif %}>Conformes</option>
                <option value="0" {% if filtres.conforme == False %}selected{% endif %}>Non conformes</option>
            </select>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" formaction="{% url 'rapports:etat_gardes_pdf' %}" class="btn-create">Télécharger PDF</button>
        <button type="submit" formaction="{% url 'rapports:etat_gardes_excel' %}" class="btn-create">Télécharger Excel</button>
        <a href="{% url 'rapports:index' %}" class="btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
