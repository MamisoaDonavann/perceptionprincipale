{% extends "base.html" %}
{% block title %}Rapport sur période{% endblock %}
{% block content %}
<div class="page-header">
    <div class="page-header__titles">
        <h1 class="page-title">Rapport sur période</h1>
        <p class="page-subtitle">Synthèse globale : gardes, décomptes, OP et paiements.</p>
    </div>
    <div><a href="{% url 'rapports:index' %}" class="btn-secondary">Retour</a></div>
</div>

<form method="get" class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label>Date de début <span class="required">*</span></label>
            <input type="date" name="date_debut" class="form-input" required
                   value="{{ filtres.date_debut|date:'Y-m-d' }}">
        </div>
        <div class="form-group">
            <label>Date de fin <span class="required">*</span></label>
            <input type="date" name="date_fin" class="form-input" required
                   value="{{ filtres.date_fin|date:'Y-m-d' }}">
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" formaction="{% url 'rapports:rapport_periode_pdf' %}" class="btn-create">Télécharger PDF</button>
        <button type="submit" formaction="{% url 'rapports:rapport_periode_excel' %}" class="btn-create">Télécharger Excel</button>
        <a href="{% url 'rapports:index' %}" class="btn-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
