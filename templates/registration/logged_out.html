{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion — Perception Marovoay</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="margin: 0; padding: 0;">

<div class="logged-out-wrapper">
    <div class="logged-out-card">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #ecfdf5; color: #10b981; display: grid; place-items: center; margin: 0 auto 20px; box-shadow: 0 4px 12px rgba(16,185,129,0.2);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1>Déconnexion réussie</h1>
        <p>Vous avez été déconnecté de l'application en toute sécurité.<br>À bientôt sur Perception Marovoay.</p>
        <a href="{% url 'login' %}" class="btn-primary" style="display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 10px; text-decoration: none; font-size: 14px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Se reconnecter
        </a>
    </div>
</div>

</body>
</html>
